repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8 # Use the latest version
    hooks:
      - id: prettier
        files: \.(json|jsonc)$ # Apply to JSON and JSONC files
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
