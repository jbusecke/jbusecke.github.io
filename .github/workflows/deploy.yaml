name: deploy-site
on:
  push:
    branches:
      - source
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    defaults:
      run:
        shell: bash -l {0}
    if: github.repository == 'jbusecke/jbusecke.github.io'
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout your repository using git
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload built site as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-pages
          path: ./dist
      - name: Deploy
        if: github.ref == 'refs/heads/source'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./dist"
  preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Artifact site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: "./dist"
          name: github-pages
      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654 # v3.0
        with:
          publish-dir: dist
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
      - name: Post or update preview comment
        env:
          PR_NUMBER: ${{ github.event.number }}
          COMMIT_SHA: ${{ github.sha }}
          PREVIEW_URL: ${{ steps.netlify.outputs.deploy-url }}
        run: |
          comment_message="This pull request is being automatically built with [GitHub Actions](https://github.com/features/actions) and [Netlify](https://www.netlify.com/). To see the status of your deployment, click below."
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | \
            jq -r --arg msg "$comment_message" \
              '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($msg))) | .id' | \
            head -1)
          printf '%s\n🔍 Git commit SHA:  %s\n✅ Deployment Preview URL: %s\n' \
            "$comment_message" "$COMMIT_SHA" "$PREVIEW_URL" > /tmp/comment-body.md
          if [ -z "$comment_id" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment-body.md
          else
            jq -Rs '{"body": .}' /tmp/comment-body.md | \
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
                --input -
          fi
